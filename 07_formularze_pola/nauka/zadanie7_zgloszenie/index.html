<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pracownia 12 — zgłoszenie</title>
</head>
<body>
  <h1>Pracownia 12 — zgłoszenie</h1>

  <form action="#" method="post">
    <p>
      <label for="imie">Imię</label>
      <input type="text" id="imie" name="imie" required />
    </p>
    <p>
      <label for="wiadomosc">Wiadomość</label><br />
      <textarea id="wiadomosc" name="wiadomosc" rows="4"></textarea>
    </p>
    <p>
      <input type="checkbox" id="zgoda" name="zgoda" value="tak" />
      <label for="zgoda">Zgoda na kontakt mailowy</label>
    </p>
    <p>Zmiana:</p>
    <p>
      <input type="radio" id="r1" name="zmiana" value="pierwsza" />
      <label for="r1">Pierwsza</label>
    </p>
    <p>
      <input type="radio" id="r2" name="zmiana" value="druga" />
      <label for="r2">Druga</label>
    </p>
    <p>
      <label for="sala">Sala</label>
      <select id="sala" name="sala">
        <option value="12">12</option>
        <option value="4">4</option>
      </select>
    </p>

    <p><button type="submit">Wyślij</button></p>
  </form>

  <p>Jan Siemieniaka</p>

  <footer>
    <p></p>
  </footer>
</body>
</html>
